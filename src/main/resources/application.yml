server:
  port: 8082
  # DIS-01: al detener una réplica termina las peticiones en curso antes de apagarse.
  shutdown: graceful

spring:
  application:
    name: auction-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auction_db}
    username: ${DB_USER:auction}
    password: ${DB_PASSWORD:auction}
    # DIS-01: con varias réplicas, cada una abre su propio pool. El PostgreSQL B1ms de QA admite ~35 conexiones de
    # usuario para los cuatro servicios; con 4 por réplica, auction puede escalar a 4 réplicas sin agotarlas.
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:4}
      minimum-idle: 1
  jackson:
    deserialization:
      # Hallazgo 2: 1.5 en un campo entero se rechaza con HTTP 400 en lugar de truncarse a 1.
      accept-float-as-int: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:cafeorbe}
    password: ${RABBIT_PASSWORD:cafeorbe}
    virtual-host: ${RABBIT_VHOST:/}
    ssl:
      enabled: ${RABBIT_SSL:false}

cafeorbe:
  seguridad:
    # SEG-02: credencial que presentan el api-gateway y los demás servicios en X-Internal-Token.
    credencial-interna: ${INTERNAL_TOKEN:cafeorbe-dev-credencial-interna-cambiar-en-prod}
  wallet:
    # Única llamada síncrona entre servicios: consulta de saldo al validar una puja (HU-14)
    url: ${WALLET_URL:http://localhost:8083}
    connect-timeout-ms: 1000
    read-timeout-ms: 2000
  outbox:
    scheduler: true
    intervalo-ms: 200
  subasta:
    anti-sniping:
      # HU-18: una puja válida cuando falta esta ventana o menos extiende el tiempo esa misma cantidad
      ventana-segundos: ${ANTISNIPING_VENTANA_SEGUNDOS:30}
      max-extensiones: ${ANTISNIPING_MAX_EXTENSIONES:3}
  cierre:
    # HU-19: el servidor cierra las subastas vencidas, aunque nadie tenga la sala abierta
    scheduler: true
    intervalo-ms: 1000

logging:
  structured:
    # OBS-01: logs JSON con correlationId (MDC) para Log Analytics.
    format:
      console: ${LOG_FORMAT:logstash}

management:
  # OBS-01: el ingress de Azure reparte entre réplicas, así que un scrape por la URL pública ve una al azar.
  # Cada réplica empuja sus métricas cada 10 s al endpoint OTLP de Grafana Cloud (sin Alloy). Apagado por defecto.
  otlp:
    metrics:
      export:
        enabled: ${OTLP_METRICS_ENABLED:false}
        url: ${OTLP_METRICS_URL:http://localhost:4318/v1/metrics}
        step: ${OTLP_METRICS_STEP:10s}
        headers:
          Authorization: ${OTLP_METRICS_AUTH:}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      # DIS-01: /actuator/health/liveness y /actuator/health/readiness para las sondas de Azure Container Apps.
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      # DIS-01 / OBS-01: réplica que reporta, para medir el reparto entre réplicas y ver cuál cae.
      instancia: ${CONTAINER_APP_REPLICA_NAME:${HOSTNAME:local}}
